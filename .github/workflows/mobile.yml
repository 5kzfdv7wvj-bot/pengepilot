name: Build PengePilot mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

env:
  APP_VERSION: 1.0.0
  PENGEPILOT_APP_DOMAIN: ${{ vars.PENGEPILOT_APP_DOMAIN }}

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web app
        run: npm run mobile:prepare
      - name: Create Android project
        run: npx cap add android
      - name: Configure Android release baseline
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run mobile:configure
      - name: Generate Android icons and splash
        run: npm run mobile:assets
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PengePilot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web app
        run: npm run mobile:prepare
      - name: Create iOS project
        run: npx cap add ios
      - name: Configure iOS release baseline
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run mobile:configure
      - name: Generate iOS icons and splash
        run: npm run mobile:assets
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          fi
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PengePilot-iOS-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
